{%- assign preview = post.index_preview -%}
<article class="notebook-entry{% unless preview %} notebook-entry-text{% endunless %}">
  {% if preview %}
    <a class="notebook-figure" href="{{ post.url | relative_url }}" tabindex="-1" aria-hidden="true">
      <img src="{{ preview.src | relative_url }}" alt="{{ preview.alt | escape }}" loading="lazy" decoding="async">
    </a>
  {% endif %}
  <div class="notebook-summary">
    <h2 class="notebook-title"><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
    {% if site.show_description and post.description %}
      <p class="notebook-description">{{ post.description }}</p>
    {% endif %}
    <p class="notebook-date"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: date_format }}</time></p>
  </div>
</article>
